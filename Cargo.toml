[package]
name = "kickstart-ou"
version = "0.1.0"
edition = "2024"

[dependencies]
ar = "0.9.0"
dirs = "7.0.0"
eframe = "0.37.0"
parselnk = "0.1.1"
reqwest = { version = "0.13.5", features = ["blocking", "multipart"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = "9.3.0"

# Creating Windows .lnk shortcuts is Windows-only; keep it off the host build.
[target."cfg(windows)".dependencies]
mslnk = "0.1.8"

[features]
default = ["include_zip"]
include_zip = []
